<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHÁ DE CASA NOVA DO VINICIUS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f1115;--card:#1a1d24;--text:#f2f2f2;--muted:#9aa0aa;
    --accent:#22c55e;--track:#2a2e37;--border:#2a2e37;--reserved:#f59e0b;
  }
  @media(prefers-color-scheme:light){
    :root{--bg:#f5f6f8;--card:#fff;--text:#1a1d24;--muted:#5b6270;--accent:#16a34a;--track:#e6e8ec;--border:#e6e8ec;}
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;}
  .wrap{width:100%;max-width:680px;}
  .wrap.wide{max-width:960px;}
  h1{font-size:22px;margin:0 0 20px;text-align:center;font-weight:900;letter-spacing:1px;}

  /* GRID DE DUAS COLUNAS */
  .content-grid{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start;}
  .col-left{display:flex;flex-direction:column;gap:16px;grid-column:1;}
  .col-right{grid-column:2;min-width:0;}
  @media(max-width:760px){
    .content-grid{grid-template-columns:1fr;}
    .col-right{grid-row:1;}
    .col-left{grid-row:2;}
  }

  /* PIX BOX */
  .pix-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;margin-bottom:20px;}
  .pix-box h2{margin:0 0 12px;font-size:16px;font-weight:700;}
  .pix-box img{width:180px;height:180px;border-radius:8px;background:#fff;padding:8px;}
  .pix-key{margin-top:10px;font-size:14px;color:var(--muted);}
  .pix-key span{display:inline-block;background:var(--track);border-radius:8px;padding:6px 12px;font-weight:700;color:var(--text);font-size:15px;margin-top:4px;cursor:pointer;user-select:all;}
  .copied{color:var(--accent);font-size:12px;margin-top:4px;opacity:0;transition:opacity .3s;}

  /* HERO */
  .hero{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 24px;text-align:center;margin-bottom:24px;}
  .hero .icon{font-size:64px;line-height:1;}
  .hero .name{font-size:32px;font-weight:800;margin:8px 0 20px;}
  .bar-outer{background:var(--track);border-radius:999px;height:28px;overflow:hidden;position:relative;margin-bottom:14px;}
  .bar-inner{background:linear-gradient(90deg,var(--accent),#4ade80);height:100%;transition:width .4s ease;}
  .bar-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;mix-blend-mode:difference;}
  .values{font-size:20px;font-weight:700;}
  .missing{color:var(--muted);font-size:15px;margin-top:4px;}
  .done-msg{font-size:20px;font-weight:700;color:var(--accent);}
  .givebtn{margin-top:18px;padding:12px 20px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:15px;cursor:pointer;white-space:nowrap;}
  .givebtn.small{margin-top:0;padding:8px 14px;font-size:13px;}
  .givebtn:disabled{opacity:.5;cursor:default;}

  /* LISTA */
  .list{display:flex;flex-direction:column;gap:10px;}
  .row{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;align-items:stretch;gap:0;position:relative;}
  .row.reserved{border-color:var(--reserved);}
  .row.completed{border-color:var(--accent);}
  .badge-reserved{position:absolute;top:8px;right:8px;background:var(--reserved);color:#000;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.5px;}
  .badge-completed{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.5px;}
  .row .main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;padding-right:14px;}
  .row .ic{font-size:26px;padding-top:2px;}
  .row .info{flex:1;min-width:0;}
  .row .rname{font-weight:700;font-size:15px;padding-right:70px;}
  .row .rbar{background:var(--track);border-radius:999px;height:8px;margin-top:6px;overflow:hidden;}
  .row .rbar-in{background:var(--accent);height:100%;}
  .row .rval{font-size:12px;color:var(--muted);margin-top:4px;}

  /* BOTÃO */
  .row-btn{display:flex;align-items:center;padding-top:2px;padding-left:10px;}

  /* LISTA ÚNICA DE DOADORES — separada dos itens */
  .donors-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 18px 8px;margin-top:22px;}
  .donors-card h2{margin:0 0 12px;font-size:15px;font-weight:800;}
  .donor-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .donor-row:last-child{border-bottom:none;}
  .donor-row .dname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .donor-row.donation .dname{color:var(--accent);white-space:normal;overflow-wrap:anywhere;line-height:1.15;}
  .donor-row.reservation .dname{color:var(--reserved);}
  .donor-row .ditem{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .donor-row .dtag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-left:6px;}
  .donors-empty{color:var(--muted);font-size:13px;padding:8px 0 16px;text-align:center;}

  /* ITENS JÁ QUITADOS — card compacto na coluna da esquerda */
  .mini-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
  .mini-row:last-child{border-bottom:none;}
  .mini-row .ic{font-size:20px;line-height:1;}
  .mini-row .info{flex:1;min-width:0;}
  .mini-row .rname{font-size:13px;font-weight:700;}
  .mini-row .rbar{background:var(--track);border-radius:999px;height:6px;margin-top:4px;overflow:hidden;}
  .mini-row .rbar-in{background:var(--accent);height:100%;width:100%;}
  .mini-row .rval{font-size:11px;color:var(--muted);margin-top:2px;}

  /* MODAL */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;}
  .overlay.open{display:flex;}
  .modal{background:var(--card);border-radius:16px;padding:24px;width:90%;max-width:360px;text-align:center;}
  .modal h3{margin:0 0 8px;font-size:18px;}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:14px;}
  .modal input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;margin-bottom:12px;}
  .modal-btns{display:flex;gap:8px;}
  .modal-btns button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:14px;}
  .modal-btns .confirm{background:var(--accent);color:#fff;}
  .modal-btns .cancel{background:var(--track);color:var(--text);}

  .edit-banner{background:#78350f;color:#fde68a;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;text-align:center;}
  .editrow{display:flex;gap:6px;margin-top:8px;}
  .editrow input{width:80px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);}

  /* ADMIN */
  .admin-wrap{width:100%;max-width:680px;padding:24px 16px 48px;}
  .admin-banner{background:#1e3a5f;color:#93c5fd;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:20px;text-align:center;font-weight:700;}
  .admin-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;}
  .admin-card h2{margin:0 0 16px;font-size:16px;font-weight:700;}
  .admin-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .admin-field label{font-size:12px;color:var(--muted);font-weight:600;}
  .admin-field input{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;}
  .admin-btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px;}
  .admin-btn:disabled{opacity:.5;cursor:default;}
  .admin-feedback{font-size:13px;margin-top:8px;min-height:18px;text-align:center;}
  .admin-feedback.ok{color:var(--accent);}
  .admin-feedback.err{color:#f87171;}
  .admin-log{margin-top:16px;}
  .admin-log h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px;}
  .log-item{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--track);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .log-item .log-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .log-item .log-name{font-weight:600;}
  .log-item .log-itemname{font-size:11px;color:var(--muted);font-weight:400;}
  .log-item .log-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .log-item .log-val{color:var(--accent);font-weight:700;white-space:nowrap;}
  .log-del{background:none;border:none;color:#f87171;font-size:16px;cursor:pointer;padding:4px 6px;border-radius:6px;line-height:1;}
  .log-del:hover{background:rgba(248,113,113,.15);}
  .log-del:disabled{opacity:.4;cursor:default;}

  /* ajustes de layout */
  h1{font-size:clamp(20px,5vw,28px);}
  .pix-box{display:flex;align-items:center;gap:20px;text-align:left;padding:16px 20px;}
  .pix-box img{width:132px;height:132px;flex-shrink:0;}
  .pix-info{flex:1;min-width:0;}
  .pix-info h2{margin-bottom:6px;}
  .pix-key{margin-top:0;}
  .pix-key + span{word-break:break-all;}
  .pix-info .givebtn{margin-top:10px;}
  .copied{margin-top:6px;}
  @media(max-width:520px){.pix-box{flex-direction:column;text-align:center;}}
  .bar-label{mix-blend-mode:normal;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);}
  .row .rname{padding-right:0;}
  #donorsList,#latestList,#completedList,#reservedList{max-height:320px;overflow-y:auto;}
  .donor-row .ditem{flex-shrink:0;}
  .givebtn{transition:transform .12s ease,opacity .12s;}
  .givebtn:not(:disabled):active{transform:scale(.97);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media(max-width:760px){.hero .givebtn{width:100%;}.hero .name{font-size:26px;}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap wide">
  <h1>CHÁ DE CASA NOVA DO VINICIUS</h1>

  <div class="pix-box">
    <img src="qrcode.jfif" alt="QR Code Pix" onerror="this.style.display='none'">
    <div class="pix-info">
      <h2>💚 Manda um Pix!</h2>
      <div class="pix-key">Chave Pix:</div>
      <span id="pixKey" onclick="copyPix()">ovnicardoso@gmail.com</span>
      <div><button class="givebtn small" onclick="copyPix()">Copiar chave</button></div>
      <div class="copied" id="copiedMsg">Copiado! ✓</div>
    </div>
  </div>

  <div id="editBanner"></div>

  <div class="content-grid">
    <div class="col-left">
      <div class="donors-card">
        <h2>💚 Lista de Doadores</h2>
        <div id="donorsList"></div>
      </div>
      <div class="donors-card">
        <h2>🕐 Últimos doadores</h2>
        <div id="latestList"></div>
      </div>
      <div class="donors-card">
        <h2>🎉 Itens já quitados</h2>
        <div id="completedList"></div>
      </div>
      <div class="donors-card">
        <h2>📦 Itens reservados</h2>
        <div id="reservedList"></div>
      </div>
    </div>
    <div class="col-right">
      <div id="hero" class="hero"><div style="color:var(--muted);padding:40px 0">Carregando…</div></div>
      <div id="list" class="list"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>🎁 Eu dou esse!</h3>
    <p id="modalItemName"></p>
    <input id="modalName" type="text" placeholder="Seu nome completo" maxlength="60">
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal()">Cancelar</button>
      <button class="confirm" onclick="confirmReserve()">Confirmar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://hcmxkywkjsipadaiomev.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjbXhreXdranNpcGFkYWlvbWV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3OTM4OTksImV4cCI6MjEwNjM2OTg5OX0.gu5zaaOBd5qKdFtYJa2DSNMaRwfvH0_FE2wJXXe48wU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const EDIT = new URLSearchParams(location.search).get("edit") === "1";
const ADMIN = new URLSearchParams(location.search).get("admin") === "1";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ── PAINEL ADMIN ──────────────────────────────────────────────
if(ADMIN){
  document.body.innerHTML = `
  <div class="admin-wrap">
    <h1>CHÁ DE CASA NOVA DO VINICIUS</h1>
    <div class="admin-banner">🔐 Painel Admin</div>

    <div class="admin-card">
      <h2>💚 Registrar Pix recebido</h2>
      <div class="admin-field">
        <label>Nome do doador</label>
        <input id="adNome" type="text" placeholder="Maria Silva" maxlength="60">
      </div>
      <div class="admin-field">
        <label>Valor (R$)</label>
        <input id="adValor" type="number" placeholder="50.00" min="0.01" step="0.01">
      </div>
      <button class="admin-btn" id="adBtn" onclick="adminPix()">Registrar Pix</button>
      <div class="admin-feedback" id="adFeedback"></div>
    </div>

    <div class="admin-card">
      <h2>📦 Registrar reserva</h2>
      <div class="admin-field">
        <label>Nome</label>
        <input id="adResNome" type="text" placeholder="João Santos" maxlength="60">
      </div>
      <div class="admin-field">
        <label>Item</label>
        <select id="adResItem" style="padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;width:100%;">
          <option value="">Carregando itens…</option>
        </select>
      </div>
      <button class="admin-btn" id="adResBtn" onclick="adminReserva()">Registrar Reserva</button>
      <div class="admin-feedback" id="adResFeedback"></div>
    </div>

    <div class="admin-card admin-log">
      <h3>Reservas ativas</h3>
      <div class="admin-feedback" id="adResLogFeedback"></div>
      <div id="adResLog">Carregando…</div>
    </div>

    <div class="admin-card admin-log">
      <h3>Últimas doações</h3>
      <div class="admin-feedback" id="adLogFeedback"></div>
      <div id="adLog">Carregando…</div>
    </div>
  </div>`;

  async function adminInit(){
    const [{data:iData},{data:dData},{data:rData}] = await Promise.all([
      sb.from("items").select("id,name,ordem").order("ordem"),
      sb.from("donations").select("*,items(name)").order("created_at",{ascending:false}).limit(40),
      sb.from("reservations").select("*,items(name)").order("created_at",{ascending:false})
    ]);
    // popula select de itens
    const sel = document.getElementById("adResItem");
    sel.innerHTML = iData.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join("");
    // reservas ativas, com botão de apagar
    const resLog = document.getElementById("adResLog");
    if(!rData||!rData.length){ resLog.textContent="Nenhuma reserva ativa."; }
    else{
      resLog.innerHTML = rData.map(r=>`<div class="log-item">
        <div class="log-left">
          <span class="log-name">📦 ${esc(r.nome)}</span>
          <span class="log-itemname">${esc(r.items?.name||"")}</span>
        </div>
        <div class="log-right">
          <button class="log-del" title="Apagar reserva" data-res-del="${r.id}">🗑️</button>
        </div>
      </div>`).join("");
      document.querySelectorAll("[data-res-del]").forEach(btn=>{
        btn.onclick=()=>adminDeleteReservation(btn.getAttribute("data-res-del"),btn);
      });
    }
    // log
    const log = document.getElementById("adLog");
    if(!dData||!dData.length){log.textContent="Nenhuma doação ainda.";return;}
    log.innerHTML = dData.map(d=>`<div class="log-item">
      <div class="log-left">
        <span class="log-name">💚 ${esc(d.nome)}</span>
        <span class="log-itemname">${esc(d.items?.name||"")}</span>
      </div>
      <div class="log-right">
        <span class="log-val">R$ ${Number(d.valor).toLocaleString("pt-BR",{minimumFractionDigits:2})}</span>
        <button class="log-del" title="Apagar doação" data-del-id="${d.id}" data-del-item="${d.item_id||""}" data-del-valor="${d.valor}">🗑️</button>
      </div>
    </div>`).join("");
    document.querySelectorAll("[data-del-id]").forEach(btn=>{
      btn.onclick=()=>adminDeleteDonation(
        btn.getAttribute("data-del-id"),
        btn.getAttribute("data-del-item"),
        parseFloat(btn.getAttribute("data-del-valor")),
        btn
      );
    });
  }

  window.adminDeleteReservation = async function(id, btn){
    if(!confirm("Apagar esta reserva? O item volta a ficar livre.")) return;
    btn.disabled = true;
    const fb = document.getElementById("adResLogFeedback");
    fb.textContent = "Apagando…"; fb.className = "admin-feedback";
    const {data:delData, error:delErr} = await sb.from("reservations").delete().eq("id", id).select();
    if(delErr){ fb.textContent="Erro ao apagar: "+delErr.message; fb.className="admin-feedback err"; btn.disabled=false; return; }
    if(!delData || !delData.length){
      fb.textContent="Nada foi apagado — falta a política de DELETE para 'anon' na tabela reservations.";
      fb.className="admin-feedback err"; btn.disabled=false; return;
    }
    fb.textContent="✓ Reserva apagada! O item voltou pra fila."; fb.className="admin-feedback ok";
    adminInit();
  };

  window.adminDeleteDonation = async function(id, itemId, valor, btn){
    if(!confirm("Apagar esta doação? O valor também será subtraído do total do item.")) return;
    btn.disabled = true;
    const fb = document.getElementById("adLogFeedback");
    fb.textContent = "Apagando…"; fb.className = "admin-feedback";

    // 1) tenta apagar e pede de volta a(s) linha(s) apagada(s), pra saber se realmente apagou
    const {data:delData, error:delErr} = await sb.from("donations").delete().eq("id", id).select();

    if(delErr){
      fb.textContent = "Erro ao apagar: " + delErr.message;
      fb.className = "admin-feedback err";
      btn.disabled = false;
      return;
    }
    if(!delData || !delData.length){
      fb.textContent = "Nada foi apagado — provavelmente falta uma política (policy) de DELETE liberada para a role 'anon' na tabela donations, no Supabase.";
      fb.className = "admin-feedback err";
      btn.disabled = false;
      return;
    }

    // 2) doação apagada de verdade — agora corrige o total do item
    if(itemId){
      const {data:itemRow, error:itemErr} = await sb.from("items").select("arrecadado").eq("id", itemId).single();
      if(!itemErr && itemRow){
        const novoArrecadado = Math.max(0, Number(itemRow.arrecadado||0) - Number(valor||0));
        const {error:updErr} = await sb.from("items").update({arrecadado:novoArrecadado}).eq("id", itemId);
        if(updErr){
          fb.textContent = "Doação apagada, mas não consegui atualizar o total do item: " + updErr.message;
          fb.className = "admin-feedback err";
          adminInit();
          return;
        }
      }
    }
    fb.textContent = "✓ Doação apagada!";
    fb.className = "admin-feedback ok";
    adminInit();
  };

  window.adminPix = async function(){
    const nome = document.getElementById("adNome").value.trim();
    const valor = parseFloat(document.getElementById("adValor").value);
    const fb = document.getElementById("adFeedback");
    const btn = document.getElementById("adBtn");
    if(!nome||!valor||valor<=0){fb.textContent="Preencha nome e valor.";fb.className="admin-feedback err";return;}
    btn.disabled=true; fb.textContent="Registrando…"; fb.className="admin-feedback";
    // o banco divide o valor: o que passa da meta de um item vai pro próximo
    const {error} = await sb.rpc("add_pix",{amount:valor, nome});
    if(error){fb.textContent="Erro: "+error.message;fb.className="admin-feedback err";}
    else{fb.textContent="✓ Pix registrado!";fb.className="admin-feedback ok";document.getElementById("adNome").value="";document.getElementById("adValor").value="";}
    btn.disabled=false;
    adminInit();
  };

  window.adminReserva = async function(){
    const nome = document.getElementById("adResNome").value.trim();
    const item_id = document.getElementById("adResItem").value;
    const fb = document.getElementById("adResFeedback");
    const btn = document.getElementById("adResBtn");
    if(!nome||!item_id){fb.textContent="Preencha nome e item.";fb.className="admin-feedback err";return;}
    btn.disabled=true; fb.textContent="Registrando…"; fb.className="admin-feedback";
    const {error} = await sb.from("reservations").insert({item_id, nome});
    if(error){fb.textContent="Erro: "+error.message;fb.className="admin-feedback err";}
    else{fb.textContent="✓ Reserva registrada!";fb.className="admin-feedback ok";document.getElementById("adResNome").value="";}
    btn.disabled=false;
  };

  adminInit();
}

const ICONS={colchao:"🛏️",cama:"🛌",geladeira:"🧊",fogao:"🍳",panelas:"🍳",pratos:"🍽️",talheres:"🍴",copos:"🥤",tigelas:"🥣",frigideira:"🍳",utensilios:"🥄",tabua:"🔪",potes:"🥡",jogoscama:"🛏️",travesseiros:"💤",cobertor:"🛌",toalhas:"🚿",kitbanheiro:"🚽",vassoura:"🧹",moprodo:"🧼",panos:"🧽",limpeza:"🧴",lixeiras:"🗑️",baldes:"🪣",armariocozinha:"🗄️",armariomultiuso:"🗄️",cabideira:"👚",caixas:"📦",cabides:"👚",sofa:"🛋️",rack:"📺",espelho:"🪞",organizadores:"📦",microondas:"📡",liquidificador:"🫙",escorredor_louca:"🍽️",assadeiras:"🥘",espremedor:"🍋",garrafa_termica:"☕",porta_sabonete:"🧴",cesto_roupa:"🧺",lampadas:"💡",lixeira_cozinha:"🗑️",lixeira_banheiro:"🗑️",pano_prato:"🧻",potes_hermeticos:"🥡",mesa_cadeiras:"🪑",tabua_cozinha:"🔪",organizador_pia:"🧹"};
const BRL=n=>"R$ "+Number(n).toLocaleString("pt-BR",{minimumFractionDigits:Number.isInteger(+n)?0:2,maximumFractionDigits:2});

let items=[], donations=[], reservations=[], pendingReserveId=null;

function copyPix(){
  const key="ovnicardoso@gmail.com";
  const ok=()=>{const m=document.getElementById("copiedMsg");m.style.opacity="1";setTimeout(()=>m.style.opacity="0",2000);};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(key).then(ok).catch(()=>{});
  else{const t=document.createElement("textarea");t.value=key;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok();}catch(e){}t.remove();}
}

function openModal(id,name){
  pendingReserveId=id;
  document.getElementById("modalItemName").textContent="Você está reservando: "+name;
  document.getElementById("modalName").value="";
  document.getElementById("overlay").classList.add("open");
  setTimeout(()=>document.getElementById("modalName").focus(),100);
}
function closeModal(){ document.getElementById("overlay").classList.remove("open"); pendingReserveId=null; }
async function confirmReserve(){
  const nome=document.getElementById("modalName").value.trim();
  if(!nome) return document.getElementById("modalName").focus();
  closeModal();
  await sb.from("reservations").insert({item_id:pendingReserveId||pendingReserveId, nome});
  // recarrega reservations
  const {data}=await sb.from("reservations").select("*");
  if(data) reservations=data;
  render();
}
// fix: pendingReserveId antes de fechar
const _confirmReserve=confirmReserve;
window.confirmReserve=async function(){
  const nome=document.getElementById("modalName").value.trim();
  if(!nome) return document.getElementById("modalName").focus();
  const id=pendingReserveId;
  closeModal();
  await sb.from("reservations").insert({item_id:id, nome});
  const {data}=await sb.from("reservations").select("*");
  if(data) reservations=data;
  render();
};

function isReserved(itemId){ return reservations.some(r=>r.item_id===itemId); }
function isCompleted(item){ return item.arrecadado>=item.meta; }

// lista única de doadores/reservas — doação NÃO mostra item; só reserva mostra o item
function renderDonorsList(){
  const el=document.getElementById("donorsList");
  if(!el) return;
  const itemName=(id)=>{ const it=items.find(i=>i.id===id); return it?it.name:""; };

  // soma tudo que a mesma pessoa doou (vários Pix, ou um Pix dividido entre itens) numa entrada só.
  // o nome é comparado sem diferenciar maiúsculas, acentos e espaços a mais
  const chave=(n)=>String(n||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ");
  const grupos=new Map();
  donations.forEach(d=>{
    const k=chave(d.nome);
    const t=new Date(d.created_at||0).getTime();
    const g=grupos.get(k);
    if(!g) grupos.set(k,{type:"donation",nome:d.nome,valor:Number(d.valor||0),ord:t});
    else{
      g.valor+=Number(d.valor||0);
      if(t>=g.ord){ g.ord=t; g.nome=d.nome; }   // mostra o nome como foi digitado na doação mais recente
    }
  });

  // doadores do que mais doou pro que menos doou (empate: o mais recente primeiro)
  const doadores=[...grupos.values()].sort((x,y)=>(y.valor-x.valor)||(y.ord-x.ord));

  // tamanho do nome por COLOCAÇÃO (1º maior, depois vai diminuindo), não pelo valor.
  // empate de valor = mesma colocação = mesmo tamanho
  const TIERS=[30,24,20,17,15];   // 1º, 2º, 3º, 4º, 5º
  const BASE_PX=13;               // 6º em diante
  let rank=0, prev=null;
  doadores.forEach((g,idx)=>{
    if(g.valor!==prev){ rank=idx; prev=g.valor; }
    g.px=TIERS[rank]!==undefined?TIERS[rank]:BASE_PX;
  });

  // reservas ficam depois dos doadores, mais recentes primeiro
  const reservas=reservations
    .map(r=>({type:"reservation",nome:r.nome,item:itemName(r.item_id),px:BASE_PX,ord:new Date(r.created_at||0).getTime()}))
    .sort((x,y)=>y.ord-x.ord);

  const entries=[...doadores.map(g=>({...g,item:""})),...reservas];

  if(!entries.length){
    el.innerHTML='<div class="donors-empty">Ninguém ajudou ainda — seja o primeiro! 🎁</div>';
    return;
  }
  el.innerHTML=entries.map(e=>`
    <div class="donor-row ${e.type}">
      <span class="dname" style="font-size:${e.px}px">${e.type==="donation"?"💚":"📦"} ${esc(e.nome)}</span>
      ${e.type==="reservation"?`<span class="ditem">${esc(e.item)} <span class="dtag">vai dar</span></span>`:""}
    </div>`).join("");
}

function timeAgo(t){
  const m=Math.floor((Date.now()-t)/60000);
  if(m<1) return "agora";
  if(m<60) return "há "+m+" min";
  const h=Math.floor(m/60);
  if(h<24) return "há "+h+" h";
  const d=Math.floor(h/24);
  return "há "+d+(d===1?" dia":" dias");
}
// últimas 5 doações (um Pix dividido entre itens conta uma vez), sem mostrar valor
function renderLatest(){
  const el=document.getElementById("latestList");
  if(!el) return;
  const g=new Map();
  donations.forEach(d=>{
    const k=d.nome+"|"+d.created_at;
    if(!g.has(k)) g.set(k,{nome:d.nome,t:new Date(d.created_at||0).getTime()});
  });
  const last=[...g.values()].sort((a,b)=>b.t-a.t).slice(0,5);
  el.innerHTML=last.length
    ? last.map(x=>`<div class="donor-row donation"><span class="dname" style="font-size:13px">💚 ${esc(x.nome)}</span><span class="ditem">${x.t?timeAgo(x.t):""}</span></div>`).join("")
    : '<div class="donors-empty">Nenhuma doação ainda.</div>';
}

function render(){
  if(EDIT) document.getElementById("editBanner").innerHTML='<div class="edit-banner">✏️ Modo edição</div>';
  const hero=document.getElementById("hero");
  const list=document.getElementById("list");
  const sorted=[...items].sort((a,b)=>a.ordem-b.ordem);
  const pending=sorted.filter(i=>!isCompleted(i)&&!isReserved(i.id));
  const reservedItems=sorted.filter(i=>!isCompleted(i)&&isReserved(i.id));
  const completed=sorted.filter(i=>isCompleted(i));
  const current=pending[0];

  const editFields=(i)=>!EDIT?"":` <div class="editrow">
    <input type="number" data-f="arrecadado" data-id="${i.id}" value="${i.arrecadado}" placeholder="Arrecadado">
    <input type="number" data-f="meta" data-id="${i.id}" value="${i.meta}" placeholder="Meta">
    <button class="givebtn small" data-save="${i.id}">Salvar</button></div>`;

  if(!current){
    hero.innerHTML=reservedItems.length
      ? '<div class="done-msg">💚 Todos os itens que faltam já foram reservados. Obrigado, pessoal!</div>'
      : '<div class="done-msg">🎉 Tudo quitado! Muito obrigado, pessoal!</div>';
  } else {
    const pct=Math.min(100,Math.floor(100*current.arrecadado/current.meta));
    const reserved=isReserved(current.id);
    // reservado: não dá pra saber quanto a pessoa vai gastar, então some o valor/barra
    const valueBlock=reserved
      ? ""
      : `<div class="bar-outer"><div class="bar-inner" style="width:${pct}%"></div><div class="bar-label">${pct}%</div></div>
         <div class="values">${BRL(current.arrecadado)} de ${BRL(current.meta)}</div>
         <div class="missing">Faltam ${BRL(current.meta-current.arrecadado)}</div>`;
    hero.innerHTML=`
      <div class="icon">${ICONS[current.id]||"🎁"}</div>
      <div class="name">${esc(current.name)}</div>
      ${valueBlock}
      <button class="givebtn" data-give="${current.id}" data-name="${esc(current.name)}" ${reserved?"disabled":""}>
        ${reserved?"Reservado":"🎁 Eu dou esse!"}
      </button>
      ${editFields(current)}`;
  }

  const renderRow=(i)=>{
    const pct=Math.min(100,Math.floor(100*i.arrecadado/i.meta));
    const reserved=isReserved(i.id);
    const badge=reserved?'<div class="badge-reserved">RESERVADO</div>':"";
    const btnLabel=reserved?"📦":"🎁";
    // reservado: não dá pra saber quanto a pessoa vai gastar, então some o valor/barra
    const valueBlock=reserved
      ? ""
      : `<div class="rbar"><div class="rbar-in" style="width:${pct}%"></div></div>
         <div class="rval">${BRL(i.arrecadado)} de ${BRL(i.meta)}</div>`;
    return `<div class="row${reserved?" reserved":""}">
      ${badge}
      <div class="main">
        <div class="ic">${ICONS[i.id]||"🎁"}</div>
        <div class="info">
          <div class="rname">${esc(i.name)}</div>
          ${valueBlock}
          ${editFields(i)}
        </div>
      </div>
      <div class="row-btn">
        <button class="givebtn small" data-give="${i.id}" data-name="${esc(i.name)}" ${reserved?"disabled":""}>
          ${btnLabel}
        </button>
      </div>
    </div>`;
  };

  list.innerHTML=pending.slice(current?1:0).map(renderRow).join("");

  const completedList=document.getElementById("completedList");
  if(completedList){
    completedList.innerHTML = completed.length
      ? completed.map(i=>`
        <div class="mini-row">
          <div class="ic">${ICONS[i.id]||"🎁"}</div>
          <div class="info">
            <div class="rname">${esc(i.name)}</div>
            <div class="rbar"><div class="rbar-in"></div></div>
            <div class="rval">${BRL(i.meta)} — meta atingida! 🎉</div>
          </div>
        </div>`).join("")
      : '<div class="donors-empty">Nenhum item quitado ainda.</div>';
  }

  const reservedListEl=document.getElementById("reservedList");
  if(reservedListEl){
    reservedListEl.innerHTML = reservedItems.length
      ? reservedItems.map(i=>{
          const r=reservations.find(x=>x.item_id===i.id);
          return `
        <div class="mini-row">
          <div class="ic">${ICONS[i.id]||"🎁"}</div>
          <div class="info">
            <div class="rname">${esc(i.name)}</div>
            <div class="rval">📦 reservado${r?" por "+r.nome:""}</div>
          </div>
        </div>`;}).join("")
      : '<div class="donors-empty">Nenhum item reservado ainda.</div>';
  }

  renderDonorsList();
  renderLatest();

  document.querySelectorAll("[data-give]").forEach(btn=>{
    if(!btn.disabled) btn.onclick=()=>openModal(btn.getAttribute("data-give"),btn.getAttribute("data-name"));
  });
  document.querySelectorAll("[data-save]").forEach(btn=>{
    btn.onclick=async()=>{
      const id=btn.getAttribute("data-save");
      const row=btn.closest(".editrow");
      const meta=parseFloat(row.querySelector('[data-f="meta"]').value);
      const arrecadado=parseFloat(row.querySelector('[data-f="arrecadado"]').value);
      btn.disabled=true;
      const {error}=await sb.from("items").update({meta,arrecadado}).eq("id",id);
      btn.disabled=false;
      if(error) alert("Erro ao salvar: "+error.message);
    };
  });
}

async function init(){
  const [{data:iData,error:iErr},{data:dData},{data:rData}]=await Promise.all([
    sb.from("items").select("*"),
    sb.from("donations").select("*"),
    sb.from("reservations").select("*")
  ]);
  if(iErr||!iData){
    document.getElementById("hero").innerHTML='<div style="color:var(--muted);padding:40px 0">Não consegui conectar ao banco.</div>';
    return;
  }
  items=iData; donations=dData||[]; reservations=rData||[];
  render();

  // realtime
  sb.channel("all-changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"items"},p=>{
      const idx=items.findIndex(i=>i.id===(p.new?.id||p.old?.id));
      if(p.eventType==="DELETE"){if(idx>-1)items.splice(idx,1);}
      else if(idx>-1){items[idx]=p.new;}else{items.push(p.new);}
      render();
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"donations"},p=>{
      donations.push(p.new); render();
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"reservations"},p=>{
      reservations.push(p.new); render();
    })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"reservations"},p=>{
      reservations=reservations.filter(r=>r.id!==p.old?.id); render();
    })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"donations"},p=>{
      donations=donations.filter(d=>d.id!==p.old?.id); render();
    })
    .subscribe();
}
if(!ADMIN){
  init();
  setInterval(renderLatest,60000);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
  document.getElementById("modalName").addEventListener("keydown",e=>{ if(e.key==="Enter") window.confirmReserve(); });
  document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });
}
</script>
